# Kimi Delta Attention (KDA), full layer, batched decode, mirroring
# tensor-program-dse/test_cases.py: kda_full_batched_decode_einsums (Test Case
# 10). Elementwise functions (silu, sigmoid, exp, norms) are written as
# products of their operands, which moves the same data.
#
# Rank variables (ranks are the upper-case names): b = batch, hd = hidden,
# dk0 = d_k0, dv = d_v, h = heads, hist = conv history,
# ar = a_rank, oh = out_hidden.
# Tensors renamed from test_cases.py, so that no tensor shares a name with a
# rank variable or rank: hidden -> X, q -> qn, k -> kn, v -> vn, a -> A_gate,
# b -> B_gate, S_{t-1} -> S_prev, o -> O.
# The KDA core is in delta-rule form, as there: kv_mem = S_prev^T (A_gate * kn),
# delta = B_gate (vn - kv_mem), S_t = A_gate S_prev + kn delta^T.
# As there, every key-dim tensor (q, k, A_gate, the rows of S) is on d_k0,
# the one key axis of the head.
# Set BATCH, HIDDEN, D_K, D_V, HEADS, A_RANK.
{% macro lcan(name, dk, norm) %}
  - "{{name}}_lin_out[b, {{dk}}, h] = X[b, hd] * {{name}}_lin_w[hd, {{dk}}, h]"
  - "{{name}}_partial_conv[b, {{dk}}, h] = {{name}}_history[b, {{dk}}, h, hist] * {{name}}_conv_w[{{dk}}, h, hist]"
  - "{{name}}_lin_out_scaled[b, {{dk}}, h] = {{name}}_lin_out[b, {{dk}}, h] * {{name}}_conv_w_0[{{dk}}, h]"
{% if norm %}
  - "{{name}}_act_out[b, {{dk}}, h] = {{name}}_lin_out_scaled[b, {{dk}}, h] * {{name}}_partial_conv[b, {{dk}}, h]"
  - "{{name}}_computed_norm[b, h] = {{name}}_act_out[b, {{dk}}, h]"
  - "{{name}}n[b, {{dk}}, h] = {{name}}_act_out[b, {{dk}}, h] * {{name}}_computed_norm[b, h]"
{% else %}
  - "{{name}}n[b, {{dk}}, h] = {{name}}_lin_out_scaled[b, {{dk}}, h] * {{name}}_partial_conv[b, {{dk}}, h]"
{% endif %}
{% endmacro %}
workload:
  rank_sizes:
    B: {{BATCH}}
    HD: {{HIDDEN}}
    DK0: {{D_K}}
    DV: {{D_V}}
    H: {{HEADS}}
    HIST: 3
    AR: {{A_RANK}}
    OH: {{HIDDEN}}
  bits_per_value: {All: 8}
  einsums:
  # q, k, v: linear, short conv, silu, (l2 norm)
{{ lcan("q", "dk0", True) }}
{{ lcan("k", "dk0", True) }}
{{ lcan("v", "dv", False) }}
  # a and b
  - "a_down[b, ar] = X[b, hd] * W_a_down[hd, ar]"
  - "a_inter[b, dk0, h] = a_down[b, ar] * W_a_up[ar, dk0, h]"
  - "A_gate[b, dk0, h] = a_inter[b, dk0, h] * exp_alog[h] * dt_bias[dk0, h]"
  - "b_inter[b, h] = X[b, hd] * W_b_down[hd, h]"
  - "B_gate[b, h] = b_inter[b, h]"
  # KDA core
  - "kv_mem[b, dv, h] = S_prev[b, dk0, dv, h] * A_gate[b, dk0, h] * kn[b, dk0, h]"
  - "delta[b, dv, h] = vn[b, dv, h] * kv_mem[b, dv, h] * B_gate[b, h]"
  - "S_t[b, dk0, dv, h] = S_prev[b, dk0, dv, h] * A_gate[b, dk0, h] * kn[b, dk0, h] * delta[b, dv, h]"
  # S_t q -> RMSNorm
  - "O[b, dv, h] = S_t[b, dk0, dv, h] * qn[b, dk0, h]"
  - "computed_o_rmsnorm[b, h] = O[b, dv, h]"
  # bypass
  - "g_inter[b, dv, h] = X[b, hd] * W_g[hd, dv, h]"
  # final output
  - "o_bypassed[b, dv, h] = O[b, dv, h] * computed_o_rmsnorm[b, h] * norm_weight[dv] * g_inter[b, dv, h]"
  - "out[b, oh] = o_bypassed[b, dv, h] * W_out[dv, h, oh]"
